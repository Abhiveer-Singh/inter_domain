out_dir: kiss_output
odometry:
    preprocessing:
        max_range: 12.0
    mapping:
        voxel_size: 0.30
local_mapper:
    voxel_size: 0.30
    splitting_distance: 3.0
loop_closer:
    overlap_threshold: 0.35
    detector:
        density_map_resolution: 0.3
        inliers_threshold: 3
pose_graph_optimizer:
    max_iterations: 8
occupancy_mapper:
    resolution: 0.25
    max_range: 12.0
    z_min: -0.2
    z_max: 1.8
